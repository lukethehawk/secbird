name: CI and test build (branch check, not for upstream)

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - name: Build CLI and tray
        run: cargo build --release
      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: secbird-basilisk-buttons-diagram-windows
          path: |
            target/release/secbird.exe
            target/release/secbird-tray.exe
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The CLI only; the tray is Windows-only for now.
      - run: cargo clippy --release -p secbird-core -p secbird --all-targets -- -D warnings
      - run: cargo test --release -p secbird-core -p secbird
