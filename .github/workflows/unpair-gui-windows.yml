name: Windows HyperSpeed unpair GUI test build

on:
  push:
    branches: [tool-hyperspeed-unpair-gui]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint unpair GUI (warnings are errors)
        run: cargo clippy --release -p secbird --bin secbird-unpair-gui -- -D warnings
      - name: Run unpair safety and decoding tests
        run: cargo test --release -p secbird --bin secbird-unpair-gui
      - name: Build portable Windows GUI
        run: cargo build --release -p secbird --bin secbird-unpair-gui
      - name: Upload standalone GUI EXE
        uses: actions/upload-artifact@v4
        with:
          name: Secretarybird-HyperSpeed-Unpair-GUI-Windows
          path: target/release/secbird-unpair-gui.exe
          retention-days: 30
